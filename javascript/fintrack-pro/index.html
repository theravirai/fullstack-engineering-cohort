<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinTrack Pro</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* CSS Variables for Light Mode */
    :root {
      /* Colors */
      --primary: #4f46e5;       /* Indigo */
      --primary-hover: #4338ca;
      --income: #10b981;        /* Green */
      --income-hover: #059669;
      --income-bg: #ecfdf5;
      --expense: #ef4444;       /* Red */
      --expense-hover: #dc2626;
      --expense-bg: #fef2f2;
      --background: #f8fafc;    /* Neutral Light */
      --card-bg: #ffffff;
      --text: #0f172a;          /* Neutral Dark */
      --text-muted: #64748b;
      --border: #e2e8f0;
      
      /* Theme Transition */
      --transition-speed: 0.3s;
    }

    /* CSS Variables for Dark Mode overrides */
    body.dark {
      --background: #0f172a;    /* Deep navy / Slate */
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --income-bg: rgba(16, 185, 129, 0.1);
      --expense-bg: rgba(239, 68, 68, 0.1);
    }

    /* Layout reset & typography base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--background);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Smooth transitions for theme changes */
    body, 
    .card, 
    nav, 
    table, 
    th, 
    td, 
    input, 
    select, 
    button, 
    .modal-content {
      transition: background-color var(--transition-speed) ease, 
                  color var(--transition-speed) ease, 
                  border-color var(--transition-speed) ease,
                  box-shadow var(--transition-speed) ease;
    }

    /* Page container layout */
    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    .page-section {
      display: none; /* hidden by default, toggled via JS */
      margin-top: 70px; /* navbar offset */
    }

    .page-section.active {
      display: block;
      animation: fadeIn var(--transition-speed) ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Navbar styles */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      z-index: 100;
    }

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 100%;
    }

    .nav-brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
    }

    .nav-links {
      display: flex;
      gap: 1rem;
    }

    .nav-link {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
    }

    .nav-link:hover {
      color: var(--text);
      background-color: var(--background);
    }

    .nav-link.active {
      color: var(--primary);
      background-color: var(--background);
      font-weight: 600;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    /* General Button styles */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem 1rem;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      border-radius: 0.375rem;
      cursor: pointer;
      border: 1px solid transparent;
      text-decoration: none;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-outline {
      background-color: transparent;
      border-color: var(--border);
      color: var(--text-muted);
    }

    .btn-outline:hover {
      background-color: var(--background);
      color: var(--text);
    }

    /* Login Screen Layout */
    .login-screen-wrapper {
      display: none;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--background);
      padding: 1rem;
    }

    .login-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      padding: 2.5rem;
      border-radius: 0.75rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .login-logo {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    .login-card p {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    .form-control {
      width: 100%;
      padding: 0.625rem 0.75rem;
      font-family: inherit;
      font-size: 0.875rem;
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      background-color: var(--card-bg);
      color: var(--text);
      outline: none;
    }

    .form-control:focus {
      border-color: var(--primary);
    }

    /* Dashboard Summary Cards Grid */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem;
      margin-top: 1.5rem;
      margin-bottom: 2rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      padding: 1.5rem;
      border-radius: 0.5rem;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
    }

    .card-title {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text);
    }

    /* Color coding left card borders and titles */
    .card-balance {
      border-left: 4px solid var(--primary);
    }
    
    .card-balance .card-value {
      color: var(--primary);
    }

    .card-income {
      border-left: 4px solid var(--income);
    }
    
    .card-income .card-value {
      color: var(--income);
    }

    .card-expense {
      border-left: 4px solid var(--expense);
    }
    
    .card-expense .card-value {
      color: var(--expense);
    }

    .card-transactions {
      border-left: 4px solid var(--text-muted);
    }

    /* Responsive adjustments for the grid */
    @media (max-width: 1024px) {
      .summary-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 640px) {
      .summary-grid {
        grid-template-columns: 1fr;
        gap: 1rem;
      }
    }

    /* Modal overlay background */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 1rem;
    }

    .modal-overlay.active {
      display: flex;
    }

    /* Modal box container */
    .modal-content {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      overflow: hidden;
      animation: modalSlideUp 0.25s ease-out;
    }

    @keyframes modalSlideUp {
      from { transform: translateY(15px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--text);
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--text-muted);
      cursor: pointer;
      line-height: 1;
    }

    .modal-close:hover {
      color: var(--text);
    }

    .modal-body {
      padding: 1.5rem;
    }

    .modal-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      background-color: var(--background);
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div id="login-screen" class="login-screen-wrapper">
    <div class="login-card">
      <div class="login-logo">FinTrack Pro</div>
      <p>Log in to track your balance, income, and expenses</p>
      
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login-username">Display Name</label>
          <input type="text" id="login-username" class="form-control" placeholder="Enter your name" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Get Started</button>
      </form>
    </div>
  </div>

  <!-- Add Transaction Modal overlay popup -->
  <div id="transaction-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Add Transaction</h3>
        <button class="modal-close" onclick="closeTransactionModal()">&times;</button>
      </div>
      
      <form id="transaction-form" onsubmit="handleTransactionSubmit(event)">
        <div class="modal-body">
          
          <div class="form-row">
            <div class="form-group">
              <label for="trans-type">Type</label>
              <select id="trans-type" class="form-control" required>
                <option value="income">Income</option>
                <option value="expense">Expense</option>
              </select>
            </div>
            
            <div class="form-group">
              <label for="trans-category">Category</label>
              <select id="trans-category" class="form-control" required>
                <option value="" disabled selected>Select Category</option>
                <option value="Food & Dining">Food & Dining</option>
                <option value="Shopping">Shopping</option>
                <option value="Recharge & Bills">Recharge & Bills</option>
                <option value="Petrol & Auto">Petrol & Auto</option>
                <option value="Utilities">Utilities</option>
                <option value="Salary">Salary</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="trans-amount">Amount</label>
              <input type="number" id="trans-amount" class="form-control" step="0.01" min="0.01" placeholder="0.00" required>
            </div>
            
            <div class="form-group">
              <label for="trans-date">Date</label>
              <input type="date" id="trans-date" class="form-control" required>
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label for="trans-desc">Description</label>
            <input type="text" id="trans-desc" class="form-control" placeholder="e.g. Salary, Groceries" required>
          </div>

        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="closeTransactionModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Transaction</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Persistent Navbar -->
  <nav class="navbar" style="display: none;">
    <div class="container nav-container">
      <div class="nav-brand">FinTrack Pro</div>
      <div class="nav-links">
        <button id="nav-dashboard" class="nav-link active" onclick="showPage('dashboard')">Dashboard</button>
        <button id="nav-settings" class="nav-link" onclick="showPage('settings')">Settings</button>
      </div>
      <div class="nav-actions">
        <button id="btn-add-transaction" class="btn btn-primary" onclick="openTransactionModal()">Add Transaction</button>
        <button id="btn-logout" class="btn btn-outline" onclick="handleLogout()">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Main App Content -->
  <div id="app" class="container" style="display: none;">
    
    <!-- Dashboard Section -->
    <section id="dashboard-page" class="page-section active">
      <div class="summary-grid">
        <!-- Balance Card -->
        <div class="card card-balance">
          <div class="card-title">Current Balance</div>
          <div id="balance-val" class="card-value">$0.00</div>
        </div>
        <!-- Income Card -->
        <div class="card card-income">
          <div class="card-title">Total Income</div>
          <div id="income-val" class="card-value">$0.00</div>
        </div>
        <!-- Expense Card -->
        <div class="card card-expense">
          <div class="card-title">Total Expense</div>
          <div id="expense-val" class="card-value">$0.00</div>
        </div>
        <!-- Transactions Card -->
        <div class="card card-transactions">
          <div class="card-title">Total Transactions</div>
          <div id="transactions-count" class="card-value">0</div>
        </div>
      </div>
    </section>

    <!-- Settings Section -->
    <section id="settings-page" class="page-section">
      <h2>Settings</h2>
      <!-- Settings content will go here -->
    </section>

  </div>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Main Logic -->
  <script>
    // State management
    const state = {
      isLoggedIn: false,
      currentPage: 'dashboard',
      userName: '',
      currency: 'USD'
    };

    // Open transaction modal and default the date picker to today
    function openTransactionModal() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('trans-date').value = today;
      
      document.getElementById('transaction-modal').classList.add('active');
    }

    // Reset inputs and close transaction modal
    function closeTransactionModal() {
      document.getElementById('transaction-form').reset();
      document.getElementById('transaction-modal').classList.remove('active');
    }

    // Close modal window if overlay backdrop is clicked directly
    window.addEventListener('click', function(event) {
      const modal = document.getElementById('transaction-modal');
      if (event.target === modal) {
        closeTransactionModal();
      }
    });

    // Form submit validation handler
    function handleTransactionSubmit(e) {
      e.preventDefault();

      const type = document.getElementById('trans-type').value;
      const category = document.getElementById('trans-category').value;
      const amount = parseFloat(document.getElementById('trans-amount').value);
      const date = document.getElementById('trans-date').value;
      const desc = document.getElementById('trans-desc').value.trim();

      // Form validation rules check
      if (!type || !category || isNaN(amount) || amount <= 0 || !date || !desc) {
        alert("Please fill in all transaction form fields correctly!");
        return;
      }

      console.log("Validated form input successfully:", { type, category, amount, date, desc });

      // Save transactions logic will be wired in Phase 6
      closeTransactionModal();
    }

    // Toggles between page sections without reloading
    function showPage(pageId) {
      if (!state.isLoggedIn) {
        showLoginScreen();
        return;
      }
      
      state.currentPage = pageId;

      // Hide all page sections, show active one
      document.querySelectorAll('.page-section').forEach(section => {
        section.classList.remove('active');
      });
      document.getElementById(`${pageId}-page`).classList.add('active');

      // Update active style on links
      document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.remove('active');
      });
      document.getElementById(`nav-${pageId}`).classList.add('active');
    }

    // Displays the login box and hides main application
    function showLoginScreen() {
      document.getElementById('app').style.display = 'none';
      document.querySelector('.navbar').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
    }

    // Displays main app interface
    function showMainApp() {
      document.getElementById('app').style.display = 'block';
      document.querySelector('.navbar').style.display = 'block';
      document.getElementById('login-screen').style.display = 'none';
      showPage(state.currentPage);
    }

    // Handle name submission to log in
    function handleLogin(e) {
      if (e) e.preventDefault();
      
      const usernameInput = document.getElementById('login-username').value.trim();
      if (!usernameInput) {
        alert("Please enter a valid display name!");
        return;
      }

      state.isLoggedIn = true;
      state.userName = usernameInput;

      // Save user state in localStorage
      localStorage.setItem('fintrack_isLoggedIn', 'true');
      localStorage.setItem('fintrack_userName', usernameInput);

      showMainApp();
    }

    // Log out user and wipe local session state
    function handleLogout() {
      state.isLoggedIn = false;
      state.userName = '';

      localStorage.removeItem('fintrack_isLoggedIn');
      localStorage.removeItem('fintrack_userName');

      showLoginScreen();
    }

    // Startup check for existing local session
    function checkSessionOnLoad() {
      const loggedIn = localStorage.getItem('fintrack_isLoggedIn') === 'true';
      const username = localStorage.getItem('fintrack_userName');

      if (loggedIn && username) {
        state.isLoggedIn = true;
        state.userName = username;
        showMainApp();
      } else {
        showLoginScreen();
      }
    }

    // Run startup check when page is fully loaded
    window.addEventListener('DOMContentLoaded', checkSessionOnLoad);
  </script>
</body>
</html>
