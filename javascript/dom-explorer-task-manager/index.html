<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Explorer | Task Manager</title>
    <meta name="description" content="An interactive Task Manager built with Vanilla JavaScript.">
    <!-- Google Fonts for modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="brand">
                <h1>DOM Explorer</h1>
                <span class="badge">Vanilla JS</span>
            </div>
        </header>

        <main class="main-content">
            <div id="task-manager-app" class="card">
                <form id="task-form" aria-label="Create a new task">
                    <div class="form-group">
                        <label for="task-title">Task Title</label>
                        <input type="text" id="task-title" placeholder="Enter task title..." required autocomplete="off">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="task-category">Category</label>
                            <select id="task-category" required>
                                <option value="" disabled selected>Select category...</option>
                                <option value="work">💼 Work</option>
                                <option value="personal">👤 Personal</option>
                                <option value="shopping">🛒 Shopping</option>
                                <option value="health">❤️ Health</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary" id="add-task-btn">
                            Add Task
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- JavaScript Modules -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
