<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokemon UI</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.css"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="main">

    <div class="container">

      <!-- TOP SECTION -->

      <div class="top-section">

        <div class="menu-btn">
          <i class="ri-menu-line"></i>
        </div>

        <img
          class="logo"
          src="https://logos-world.net/wp-content/uploads/2020/05/Pokemon-Logo.png"
          alt="Pokemon Logo"
        />

        <div class="theme-btn">
          <i class="ri-sun-line"></i>
        </div>

      </div>


      <!-- SEARCH SECTION -->

      <div class="search-section">

        <div class="search-box">
          <i class="ri-search-line"></i>
          <input type="text" placeholder="Search for a Pokémon..." />
        </div>


        <div class="filter-section">

          <button class="filter-btn">
            Filter by types (1)
            <i class="ri-arrow-down-s-line"></i>
          </button>

          <div class="sort-btn">
            <i class="ri-equalizer-line"></i>
          </div>

        </div>

      </div>


      <!-- CARD SECTION -->

      <div class="cards">


        <!-- CARD 1 -->

        <div class="card grass-card">

          <span class="pokemon-number">#0908</span>

          <div class="heart-icon">
            <i class="ri-heart-line"></i>
          </div>

          <img
            class="pokemon-image"
            src="https://img.pokemondb.net/artwork/large/meowscarada.jpg"
            alt="Meowscarada"
          />

          <h2>Meowscarada</h2>

          <div class="card-bottom">
            <span class="type grass">GRASS</span>

            <div class="arrow-btn">
              <i class="ri-arrow-right-line"></i>
            </div>
          </div>

        </div>


        <!-- CARD 2 -->

        <div class="card dark-card">

          <span class="pokemon-number">#0624</span>

          <div class="heart-icon">
            <i class="ri-heart-line"></i>
          </div>

          <img
            class="pokemon-image"
            src="https://img.pokemondb.net/artwork/large/pawniard.jpg"
            alt="Pawniard"
          />

          <h2>Pawniard</h2>

          <div class="card-bottom">
            <span class="type dark">DARK / STEEL</span>

            <div class="arrow-btn">
              <i class="ri-arrow-right-line"></i>
            </div>
          </div>

        </div>


        <!-- CARD 3 -->

        <div class="card fire-card">

          <span class="pokemon-number">#0229</span>

          <div class="heart-icon">
            <i class="ri-heart-line"></i>
          </div>

          <img
            class="pokemon-image"
            src="https://img.pokemondb.net/artwork/large/houndoom.jpg"
            alt="Houndoom"
          />

          <h2>Houndoom</h2>

          <div class="card-bottom">
            <span class="type fire">DARK / FIRE</span>

            <div class="arrow-btn">
              <i class="ri-arrow-right-line"></i>
            </div>
          </div>

        </div>


        <!-- CARD 4 -->

        <div class="card water-card">

          <span class="pokemon-number">#0686</span>

          <div class="heart-icon">
            <i class="ri-heart-line"></i>
          </div>

          <img
            class="pokemon-image"
            src="https://img.pokemondb.net/artwork/large/inkay.jpg"
            alt="Inkay"
          />

          <h2>Inkay</h2>

          <div class="card-bottom">
            <span class="type water">DARK / PSYCHIC</span>

            <div class="arrow-btn">
              <i class="ri-arrow-right-line"></i>
            </div>
          </div>

        </div>


      </div>


      <!-- FOOTER -->

      <div class="footer">

        <div class="footer-box">
          <i class="ri-compass-3-fill"></i>
          <div>
            <h4>Explore</h4>
            <p>Discover all your favorite Pokémon</p>
          </div>
        </div>


        <div class="footer-box">
          <i class="ri-leaf-fill"></i>
          <div>
            <h4>Filter</h4>
            <p>Find Pokémon by types and abilities</p>
          </div>
        </div>


        <div class="footer-box">
          <i class="ri-star-fill"></i>
          <div>
            <h4>Collection</h4>
            <p>Save and manage your collection</p>
          </div>
        </div>


        <div class="footer-box">
          <i class="ri-bar-chart-fill"></i>
          <div>
            <h4>Stats</h4>
            <p>View stats and learn about Pokémon</p>
          </div>
        </div>


      </div>


    </div>

  </div>

</body>
</html>
